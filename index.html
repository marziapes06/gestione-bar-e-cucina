        background-size: cover;
        background-position: center 35%;
        min-height: 220px;
        padding: 26px 16px 14px;
        text-align: center;
        border-bottom: 2px solid var(--border);
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .brand-logo { height: 78px; width: auto; margin: 0 auto; display: block; filter: drop-shadow(0 2px 6px rgba(255,255,255,0.9)) drop-shadow(0 2px 10px rgba(255,255,255,0.6)); }
    .menu-flourish { font-family: 'Dancing Script', cursive; font-size: 32px; color: var(--red); margin-top: 6px; }

    .category-nav { display: flex; gap: 8px; overflow-x: auto; padding: 12px 14px; background: var(--cream-light); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 90; -webkit-overflow-scrolling: touch; }
    .category-nav::-webkit-scrollbar { display: none; }
    .category-chip { flex-shrink: 0; background: var(--cream); border: 1px solid var(--border); color: var(--ink); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; letter-spacing: 0.3px; }
    .category-chip.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }

    .container { max-width: 640px; margin: 0 auto; padding: 20px 18px; }

    .category-section { margin-bottom: 20px; scroll-margin-top: 70px; }
    .category-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
    .category-name { font-family: 'Playfair Display', serif; font-size: 21px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink); }
    .category-chevron { font-size: 16px; color: var(--red); transition: transform 0.2s ease; }
    .category-section.open .category-chevron { transform: rotate(180deg); }
    .category-dishes { display: none; padding-top: 12px; }
    .category-section.open .category-dishes { display: block; }

    .dish { padding: 11px 0; border-bottom: 1px solid var(--border); }
    .dish:last-child { border-bottom: none; }
    .dish-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .dish-name { font-weight: 700; font-size: 15px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--border); }
    .dish-price { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 15px; color: var(--red); white-space: nowrap; }
    .dish-desc { font-size: 13px; color: var(--ink-soft); margin-top: 4px; line-height: 1.45; }
    .dish-allergens { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
    .allergen-tag { font-size: 10px; font-weight: 700; background: var(--cream-light); color: var(--red); border: 1px solid var(--red); padding: 2px 7px; border-radius: 10px; }

    .legend-section { background: var(--cream-light); border-radius: 10px; padding: 16px 18px; margin-top: 24px; border: 1px solid var(--border); font-size: 12px; color: var(--ink-soft); line-height: 1.6; }
    .legend-title { font-family: 'Playfair Display', serif; font-size: 14px; color: var(--red); margin-bottom: 8px; text-transform: uppercase; font-weight: 700; }

    .loading-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
    .footer-note { text-align: center; font-family: 'Dancing Script', cursive; font-size: 22px; color: var(--red); margin-top: 26px; }
</style>

    async function initFirebase() {
        try {
            const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
            const fsMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
            const app = appMod.initializeApp(firebaseConfig);
            const db = fsMod.getFirestore(app);
            return { db, doc: fsMod.doc, getDoc: fsMod.getDoc, setDoc: fsMod.setDoc, onSnapshot: fsMod.onSnapshot };
        } catch (e) {
            console.error('Errore inizializzazione Firebase', e);
            return null;
        }
    }

    async function initData() {
        fs = await initFirebase();
        if (!fs) {
            dishes = DEFAULT_DISHES;
            products = [];
            renderMenu();
            return;
        }

        const dishRef = fs.doc(fs.db, 'terrarossa', 'piatti');
        const dishSnap = await fs.getDoc(dishRef);
        if (dishSnap.exists() && dishSnap.data().value) {
            dishes = JSON.parse(dishSnap.data().value);
        } else {
            dishes = DEFAULT_DISHES;
            await fs.setDoc(dishRef, { value: JSON.stringify(dishes) });
        }

        const prodRef = fs.doc(fs.db, 'terrarossa', 'products');
        const prodSnap = await fs.getDoc(prodRef);
        products = (prodSnap.exists() && prodSnap.data().value) ? JSON.parse(prodSnap.data().value) : [];

        renderMenu();

        // Aggiornamento automatico in tempo reale: nessun pulsante visibile ai clienti,
        // il menu si ricalcola da solo appena cambia qualcosa nel magazzino o nel menu stesso.
        fs.onSnapshot(prodRef, (snap) => {
            if (snap.exists() && snap.data().value) {
                products = JSON.parse(snap.data().value);
                renderMenu();
            }
        });
        fs.onSnapshot(dishRef, (snap) => {
            if (snap.exists() && snap.data().value) {
                dishes = JSON.parse(snap.data().value);
                renderMenu();
            }
        });
    }

    // --- Corrispondenza ingredienti piatto <-> prodotti scorte (per calcolare gli allergeni) ---
    const IT_STOPWORDS = ['di','da','in','il','la','le','gli','e','o','del','della','dei','delle','con','per','a','dell','nell','sull','all'];
    function normalizeTokens(str) {
        return (str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9\s]/g, ' ').split(/\s+/)
            .filter(w => w.length > 1 && !IT_STOPWORDS.includes(w));
    }
    function stemToken(t) { return t.length > 4 ? t.slice(0, t.length - 1) : t; }
    function tokensOverlapMatch(tokensA, tokensB) {
        if (tokensA.length === 0 || tokensB.length === 0) return false;
        const stemsB = tokensB.map(stemToken);
        const overlap = tokensA.filter(t => stemsB.includes(stemToken(t))).length;
        return overlap >= Math.min(tokensA.length, tokensB.length);
    }

    function computeDishAllergens(dish) {
        const codes = new Set();
        (dish.ingredienti || []).forEach(ingName => {
            const tokensIng = normalizeTokens(ingName);
            const match = products.find(p => p.ingrediente && tokensOverlapMatch(tokensIng, normalizeTokens(p.ingrediente)));
            if (match && match.allergeni) match.allergeni.forEach(c => codes.add(c));
        });
        return Array.from(codes);
    }

    function slugify(s) {
        return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-');
    }

    function renderMenu() {

            return `
            <div class="category-section${i === 0 ? ' open' : ''}" id="cat-${slugify(cat)}">
                <div class="category-header" onclick="toggleCategory('${slugify(cat)}')">
                    <div class="category-name">${cat}</div>
                    <div class="category-chevron">▾</div>
                </div>
                <div class="category-dishes">${dishesHtml}</div>
            </div>`;
        }).join('');
    }

    function toggleCategory(slug) {
        document.getElementById('cat-' + slug).classList.toggle('open');
    }
    function scrollToCategory(slug) {
        const el = document.getElementById('cat-' + slug);
        el.classList.add('open');
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    initData();
</script>
</body>
</html>
