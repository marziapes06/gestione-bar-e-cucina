<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terrarossa — Menu</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: #f2f1ef;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .menu-wrap {
        max-width: 700px;
        width: 100%;
        background: #ffffff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 30px rgba(43,36,31,0.12);
    }
    .menu-wrap img {
        width: 100%;
        height: auto;
        display: block;
    }
    .footer-note {
        text-align: center;
        font-size: 12px;
        color: #8a8783;
        padding: 14px;
    }
</style>
</head>
<body>
    <div class="menu-wrap">
        <img src="menu.png" alt="Menu Terrarossa">
        <div class="footer-note">Terrarossa — sporting | social | relaxing club</div>
    </div>
</body>
</html>
